events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;
    
    # Gzip compression
    gzip on;
    gzip_types
        text/plain
        text/css
        text/js
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml+rss;

    server {
        listen 80;
        server_name autointelli.com www.autointelli.com;
        
        root /usr/share/nginx/html;
        index index.html index.htm;
        
        # Strapi admin panel - rewrite /strapi-admin to /admin
        location ~ ^/strapi-admin(.*)$ {
            proxy_pass http://backend:1337/admin$1;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-Ssl on;
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;
            proxy_redirect off;
        }

        # Strapi admin assets and panel (direct access)
        location /admin/ {
            proxy_pass http://backend:1337/admin/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-Ssl on;
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;
            proxy_redirect off;
        }
        
        # API proxy to backend
        location /api/ {
            proxy_pass http://backend:1337/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-Ssl on;
            proxy_cache_bypass $http_upgrade;
        }
        
        # Handle client-side routing for React app (MUST come after admin and api)
        location / {
            try_files $uri $uri/ /index.html;
        }
        
        # Static assets (exclude admin paths)
        location ~* ^/(?!admin|api|strapi-admin).*\.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}