services:
  # Strapi Backend with SQLite (for development)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      DATABASE_CLIENT: sqlite
      DATABASE_FILENAME: .tmp/data.db
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      HOST: ${HOST}
      PORT: ${PORT}
      NODE_ENV: development
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      CALENDLY_LINK: ${CALENDLY_LINK}
      FRONTEND_URL: ${FRONTEND_URL}
    volumes:
      - strapi_data:/app/.tmp
      - strapi_uploads:/app/public/uploads
    ports:
      - "1337:1337"
    networks:
      - autointelli

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - autointelli

volumes:
  strapi_data:
  strapi_uploads:

networks:
  autointelli:
    driver: bridge